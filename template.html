<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Parkway Global Partners</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" integrity="sha512-6AYkNPc8EvA9WwC0CvbRQHWpK1zV1+QeW+lVBfYqN2zTfG9IfWMRMyUDOw6GdF5US0poI/C/pz8tkiL+nfmYHg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf3e8;
    --cream-deep:#f3e5cf;
    --ink:#2c2420;
    --ink-soft:#6b5d52;
    --orange:#c9722b;
    --orange-soft:#f0ddc4;
    --teal:#2f6f74;
    --teal-soft:#dcebe9;
    --plum:#7d3f5c;
    --plum-soft:#ecd9e1;
    --line:#e7d9c4;
    --card:#ffffff;
    --shadow: 0 10px 30px rgba(44,36,32,0.14);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --cream:#201a15;
      --cream-deep:#241d17;
      --ink:#f4eade;
      --ink-soft:#c9b9a8;
      --orange-soft:#3a2a1a;
      --teal-soft:#16302e;
      --plum-soft:#34202a;
      --line:#3a2e22;
      --card:#2a221b;
      --shadow: 0 10px 30px rgba(0,0,0,0.45);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:"Cabin","Segoe UI",system-ui,sans-serif;}
  #app{display:flex;min-height:100vh;}
  #sidebar{
    width:340px;min-width:340px;background:var(--cream-deep);border-right:1px solid var(--line);
    display:flex;flex-direction:column;max-height:100vh;position:sticky;top:0;
  }
  .sb-head{
    padding:24px 22px 16px;border-bottom:1px solid var(--line);position:relative;overflow:hidden;
  }
  .sb-head::before{
    content:"";position:absolute;inset:0 0 auto 0;height:5px;
    background:linear-gradient(90deg, var(--teal) 0%, var(--teal) 33%, var(--orange) 33%, var(--orange) 66%, var(--plum) 66%, var(--plum) 100%);
  }
  .sb-head .logo{display:block;width:100%;height:auto;margin:10px 0 14px;}
  .sb-head p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.45;}
  .stats{display:flex;gap:10px;margin-top:12px;}
  .stat{flex:1;background:var(--card);border-radius:12px;padding:8px 10px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.05);}
  .stat b{display:block;font-size:17px;color:var(--orange);}
  .stat span{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .filters{display:flex;flex-wrap:wrap;gap:8px;padding:14px 22px;border-bottom:1px solid var(--line);}
  .filter-chip{
    display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);
    background:var(--card);font-size:12.5px;cursor:pointer;user-select:none;transition:transform .12s ease;
  }
  .filter-chip:hover{transform:translateY(-1px);}
  .filter-chip .dot{width:9px;height:9px;border-radius:50%;}
  .filter-chip.off{opacity:.4;}
  #list{flex:1;overflow-y:auto;padding:6px 10px 20px;}
  .group{margin:10px 10px 0;}
  .group summary{
    list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
    padding:10px 10px;border-radius:10px;font-weight:700;font-size:13px;letter-spacing:.02em;
  }
  .group summary::-webkit-details-marker{display:none;}
  .group summary .chev{transition:transform .15s ease;font-size:11px;color:var(--ink-soft);}
  .group[open] summary .chev{transform:rotate(90deg);}
  .group .count{font-weight:500;color:var(--ink-soft);font-size:11.5px;}
  .row{
    display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;cursor:pointer;
    transition:background .12s ease;
  }
  .row:hover,.row.active{background:var(--card);}
  .row img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18);}
  .row .ph-fallback{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;}
  .row .meta{min-width:0;}
  .row .meta .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .meta .loc{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #map-wrap{flex:1;position:relative;}
  #map{position:absolute;inset:0;}
  .brand-ribbon{
    position:absolute;z-index:500;top:16px;left:16px;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);
    padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:12.5px;color:var(--ink);display:none;
  }
  @media (prefers-color-scheme: dark){ .brand-ribbon{background:rgba(42,34,27,.9);} }
  #fs-btn{
    position:absolute;z-index:500;top:16px;right:16px;width:38px;height:38px;border-radius:10px;border:none;
    background:var(--card);box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;justify-content:center;
    color:var(--ink);
  }
  #mobile-toggle{display:none;}
  .maplibregl-popup-content{border-radius:16px;padding:0;overflow:hidden;box-shadow:var(--shadow);width:260px;}
  .maplibregl-popup-tip{box-shadow:none;}
  .maplibregl-popup-close-button{z-index:2;font-size:18px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);right:6px;top:4px;}
  .pop{display:flex;flex-direction:column;}
  .pop img{width:100%;height:150px;object-fit:cover;}
  .pop-body{padding:14px 16px 16px;}
  .pop-cat{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:8px;}
  .pop h3{margin:0 0 4px;font-size:16px;color:var(--ink);}
  .pop .loc{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;display:flex;align-items:center;gap:5px;}
  .pop p.note{font-size:12.5px;color:var(--ink);line-height:1.4;margin:0 0 10px;}
  .pop a.learn{display:inline-block;font-size:12.5px;font-weight:700;color:var(--teal);text-decoration:none;border-bottom:1.5px solid var(--teal);}

  .pin{position:relative;width:46px;height:56px;cursor:pointer;}
  .pin .ring{
    position:absolute;top:7.7px;left:3px;width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    box-shadow:0 3px 8px rgba(0,0,0,.3);
  }
  .pin img, .pin .fallback{
    position:absolute;top:11.7px;left:7px;width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #fff;
  }
  .pin .fallback{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;background:#999;}
  .pin:hover{z-index:1000 !important;}
  .pin:hover .ring{filter:brightness(1.1);}

  @media (max-width: 860px){
    #app{flex-direction:column;}
    #sidebar{
      position:fixed;inset:0 0 0 auto;width:86vw;min-width:0;max-width:360px;z-index:1200;
      transform:translateX(100%);transition:transform .25s ease;box-shadow:-10px 0 30px rgba(0,0,0,.25);
    }
    #sidebar.open{transform:translateX(0);}
    #map-wrap{height:100vh;width:100%;}
    #mobile-toggle{
      display:flex;position:absolute;z-index:900;top:16px;left:16px;align-items:center;gap:8px;
      background:var(--card);border:none;border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;
    }
    #fs-btn{display:none;}
    #sb-close{display:block !important;}
  }
  #sb-close{display:none;position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <button id="sb-close" aria-label="Close">&times;</button>
    <div class="sb-head">
      <img class="logo" src="assets/logo.png" alt="Parkway Global Partners">
      <p>Explore where our missionaries are serving around the world.</p>
      <div class="stats">
        <div class="stat"><b id="stat-total">0</b><span>Partners</span></div>
        <div class="stat"><b id="stat-countries">0</b><span>Countries</span></div>
        <div class="stat"><b id="stat-cats">3</b><span>Categories</span></div>
      </div>
    </div>
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </aside>

  <div id="map-wrap">
    <button id="mobile-toggle">&#9776; Partner List</button>
    <button id="fs-btn" title="Fullscreen" aria-label="Toggle fullscreen">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
    <div id="map"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js" integrity="sha512-x8Bt/82VRs91xVTqHDpQ1t8c4qit3QCRbo9BVqnUsyw5yKqzvL4BAgcz7R34BDCiCwx9ypXPTnxPaNnazQz1ag==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
const PARTNERS = __PARTNERS_JSON__;

const CATS = {
  planters: { label: "Church Planters", color: "#2f6f74", soft: "var(--teal-soft)" },
  outreach: { label: "Gospel Outreach", color: "#c9722b", soft: "var(--orange-soft)" },
  support:  { label: "Gospel Support",  color: "#7d3f5c", soft: "var(--plum-soft)" },
};

// Brand-colored basemap built on OpenFreeMap's free, no-API-key vector tiles
// (OpenMapTiles schema). Only land/water/borders/labels are kept — roads,
// buildings, and landuse are dropped for a clean, minimal "canvas" look.
const LAND = '#f5e6cf';
const WATER = '#b7dddb';
const BORDER = '#c2a06b';
const LABEL_INK = '#2c2420';
const LABEL_INK_SOFT = '#6b5d52';

function labelPaint(size){
  return { 'text-color': LABEL_INK, 'text-halo-color': LAND, 'text-halo-width': size || 1.3, 'text-halo-blur': 0.3 };
}

const MAP_STYLE = {
  version: 8,
  sources: {
    openmaptiles: {
      type: 'vector',
      url: 'https://tiles.openfreemap.org/planet',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
    },
  },
  glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
  sprite: 'https://tiles.openfreemap.org/sprites/ofm_f384/ofm',
  layers: [
    { id: 'background', type: 'background', paint: { 'background-color': LAND } },
    { id: 'water', type: 'fill', source: 'openmaptiles', 'source-layer': 'water',
      filter: ['all', ['match', ['geometry-type'], ['MultiPolygon','Polygon'], true, false], ['!=', ['get','brunnel'], 'tunnel']],
      paint: { 'fill-color': WATER, 'fill-antialias': true } },
    { id: 'boundary_3', type: 'line', source: 'openmaptiles', 'source-layer': 'boundary', minzoom: 8,
      filter: ['all', ['==', ['typeof', ['get','admin_level']], 'number'], ['>=', ['get','admin_level'], 3], ['<=', ['get','admin_level'], 6], ['!=', ['get','maritime'], 1], ['!=', ['get','disputed'], 1], ['!', ['has','claimed_by']]],
      paint: { 'line-color': BORDER, 'line-opacity': 0.55, 'line-dasharray': [1,1], 'line-width': ['interpolate', ['linear'], ['zoom'], 7,1, 11,2] } },
    { id: 'boundary_2', type: 'line', source: 'openmaptiles', 'source-layer': 'boundary',
      filter: ['all', ['==', ['get','admin_level'], 2], ['!=', ['get','maritime'], 1], ['!=', ['get','disputed'], 1], ['!', ['has','claimed_by']]],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': BORDER, 'line-opacity': ['interpolate', ['linear'], ['zoom'], 0,0.6, 4,1], 'line-width': ['interpolate', ['linear'], ['zoom'], 3,1, 5,1.2, 12,3] } },
    { id: 'boundary_disputed', type: 'line', source: 'openmaptiles', 'source-layer': 'boundary',
      filter: ['all', ['!=', ['get','maritime'], 1], ['==', ['get','disputed'], 1]],
      paint: { 'line-color': BORDER, 'line-dasharray': [1,2], 'line-width': ['interpolate', ['linear'], ['zoom'], 3,1, 5,1.2, 12,3] } },
    { id: 'label_country_1', type: 'symbol', source: 'openmaptiles', 'source-layer': 'place', maxzoom: 9,
      filter: ['all', ['==', ['get','class'], 'country'], ['==', ['get','rank'], 1]],
      layout: { 'text-field': ['coalesce', ['get','name_en'], ['get','name']], 'text-font': ['Noto Sans Bold'], 'text-max-width': 6.25, 'text-size': ['interpolate', ['linear'], ['zoom'], 1,9, 4,17] },
      paint: labelPaint() },
    { id: 'label_country_2', type: 'symbol', source: 'openmaptiles', 'source-layer': 'place', maxzoom: 9,
      filter: ['all', ['==', ['get','class'], 'country'], ['==', ['get','rank'], 2]],
      layout: { 'text-field': ['coalesce', ['get','name_en'], ['get','name']], 'text-font': ['Noto Sans Bold'], 'text-max-width': 6.25, 'text-size': ['interpolate', ['linear'], ['zoom'], 2,9, 5,17] },
      paint: labelPaint() },
    { id: 'label_country_3', type: 'symbol', source: 'openmaptiles', 'source-layer': 'place', minzoom: 2, maxzoom: 9,
      filter: ['all', ['==', ['get','class'], 'country'], ['>=', ['get','rank'], 3]],
      layout: { 'text-field': ['coalesce', ['get','name_en'], ['get','name']], 'text-font': ['Noto Sans Bold'], 'text-max-width': 6.25, 'text-size': ['interpolate', ['linear'], ['zoom'], 3,9, 7,17] },
      paint: labelPaint() },
    { id: 'label_state', type: 'symbol', source: 'openmaptiles', 'source-layer': 'place', minzoom: 5, maxzoom: 8,
      filter: ['==', ['get','class'], 'state'],
      layout: { 'text-field': ['coalesce', ['get','name_en'], ['get','name']], 'text-font': ['Noto Sans Italic'], 'text-letter-spacing': 0.2, 'text-max-width': 9, 'text-transform': 'uppercase', 'text-size': ['interpolate', ['linear'], ['zoom'], 5,10, 8,14] },
      paint: { 'text-color': LABEL_INK_SOFT, 'text-halo-color': LAND, 'text-halo-width': 1, 'text-halo-blur': 0.3 } },
    { id: 'label_city_capital', type: 'symbol', source: 'openmaptiles', 'source-layer': 'place', minzoom: 3,
      filter: ['all', ['==', ['get','class'], 'city'], ['==', ['get','capital'], 2]],
      layout: { 'icon-image': ['step', ['zoom'], 'circle_11_black', 9, ''], 'icon-allow-overlap': true, 'icon-optional': false, 'icon-size': 0.5,
        'text-field': ['coalesce', ['get','name_en'], ['get','name']], 'text-font': ['Noto Sans Bold'], 'text-anchor': 'bottom', 'text-offset': [0,-0.2], 'text-max-width': 8,
        'text-size': ['interpolate', ['exponential',1.2], ['zoom'], 3,12, 11,18] },
      paint: labelPaint() },
    { id: 'label_city', type: 'symbol', source: 'openmaptiles', 'source-layer': 'place', minzoom: 3,
      filter: ['all', ['==', ['get','class'], 'city'], ['!=', ['get','capital'], 2]],
      layout: { 'icon-image': ['step', ['zoom'], 'circle_11_black', 9, ''], 'icon-allow-overlap': true, 'icon-optional': false, 'icon-size': 0.4,
        'text-field': ['coalesce', ['get','name_en'], ['get','name']], 'text-font': ['Noto Sans Regular'], 'text-anchor': 'bottom', 'text-offset': [0,-0.1], 'text-max-width': 8,
        'text-size': ['interpolate', ['exponential',1.2], ['zoom'], 3,11, 11,16] },
      paint: labelPaint() },
    { id: 'label_town', type: 'symbol', source: 'openmaptiles', 'source-layer': 'place', minzoom: 6,
      filter: ['==', ['get','class'], 'town'],
      layout: { 'icon-image': ['step', ['zoom'], 'circle_11_black', 10, ''], 'icon-allow-overlap': true, 'icon-optional': false, 'icon-size': 0.2,
        'text-field': ['coalesce', ['get','name_en'], ['get','name']], 'text-font': ['Noto Sans Regular'], 'text-anchor': 'bottom', 'text-max-width': 8,
        'text-size': ['interpolate', ['exponential',1.2], ['zoom'], 7,12, 11,14] },
      paint: labelPaint(1) },
    { id: 'label_village', type: 'symbol', source: 'openmaptiles', 'source-layer': 'place', minzoom: 9,
      filter: ['==', ['get','class'], 'village'],
      layout: { 'icon-image': ['step', ['zoom'], 'circle_11_black', 10, ''], 'icon-allow-overlap': true, 'icon-optional': false, 'icon-size': 0.2,
        'text-field': ['coalesce', ['get','name_en'], ['get','name']], 'text-font': ['Noto Sans Regular'], 'text-anchor': 'bottom', 'text-max-width': 8,
        'text-size': ['interpolate', ['exponential',1.2], ['zoom'], 7,10, 11,12] },
      paint: labelPaint(1) },
  ],
};

const map = new maplibregl.Map({
  container: 'map',
  style: MAP_STYLE,
  center: [-10, 22],
  zoom: 2,
  minZoom: 1,
  attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');

// Cap panning at the poles while leaving longitude free to wrap horizontally
// (MapLibre's own maxBounds would also block horizontal wrap, so clamp by hand).
map.on('move', () => {
  const c = map.getCenter();
  if (c.lat > 85 || c.lat < -85) map.setCenter([c.lng, Math.max(-85, Math.min(85, c.lat))]);
});

function initials(name){
  return name.replace(/\(.*?\)/g,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function makeMarkerEl(p){
  const c = CATS[p.cat].color;
  const inner = p.photo
    ? `<img src="${p.photo}" alt="">`
    : `<div class="fallback" style="background:${c}">${initials(p.name)}</div>`;
  const el = document.createElement('div');
  el.className = 'pin';
  el.innerHTML = `<div class="ring" style="background:${c}"></div>${inner}`;
  return el;
}

function popupHtml(p){
  const cat = CATS[p.cat];
  const photo = p.photo ? `<img src="${p.photo}" alt="">` : '';
  const learn = p.link ? `<a class="learn" href="${p.link}" target="_blank" rel="noopener">Visit website &rarr;</a>` : '';
  const note = (!p.link && p.note) ? `<p class="note">${p.note}</p>` : '';
  return `<div class="pop">${photo}<div class="pop-body">
    <span class="pop-cat" style="background:${cat.soft};color:${cat.color}">${cat.label}</span>
    <h3>${p.name}</h3>
    <div class="loc">&#128205; ${p.location}</div>
    ${note}${learn}
  </div></div>`;
}

const markers = {};
const catGroups = { planters: [], outreach: [], support: [] };

PARTNERS.forEach(p => {
  const el = makeMarkerEl(p);
  const popup = new maplibregl.Popup({ offset: 46, maxWidth: '280px' }).setHTML(popupHtml(p));
  const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
    .setLngLat([p.lng, p.lat])
    .setPopup(popup)
    .addTo(map);
  el.addEventListener('click', () => setActiveRow(p.id));
  markers[p.id] = marker;
  catGroups[p.cat].push(marker);
});

function openPopup(id){
  const popup = markers[id].getPopup();
  if (!popup.isOpen()) markers[id].togglePopup();
}

// --- Sidebar: filters ---
const filtersEl = document.getElementById('filters');
const activeCats = new Set(Object.keys(CATS));
Object.entries(CATS).forEach(([key, cfg]) => {
  const chip = document.createElement('div');
  chip.className = 'filter-chip';
  chip.innerHTML = `<span class="dot" style="background:${cfg.color}"></span>${cfg.label}`;
  chip.addEventListener('click', () => {
    if (activeCats.has(key)) {
      activeCats.delete(key);
      chip.classList.add('off');
      catGroups[key].forEach(m => m.remove());
    } else {
      activeCats.add(key);
      chip.classList.remove('off');
      catGroups[key].forEach(m => m.addTo(map));
    }
    renderList();
  });
  filtersEl.appendChild(chip);
});

// --- Sidebar: grouped list ---
const listEl = document.getElementById('list');
function renderList(){
  listEl.innerHTML = '';
  Object.keys(CATS).forEach(key => {
    if (!activeCats.has(key)) return;
    const items = PARTNERS.filter(p => p.cat === key);
    const cfg = CATS[key];
    const details = document.createElement('details');
    details.className = 'group';
    details.open = true;
    const summary = document.createElement('summary');
    summary.style.color = cfg.color;
    summary.innerHTML = `<span>&#9654; ${cfg.label}</span><span class="count">${items.length}</span>`;
    const chev = summary.querySelector('span');
    details.appendChild(summary);
    items.forEach(p => {
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.id = p.id;
      const img = p.photo
        ? `<img src="${p.photo}" alt="">`
        : `<div class="ph-fallback" style="background:${cfg.color}">${initials(p.name)}</div>`;
      row.innerHTML = `${img}<div class="meta"><div class="nm">${p.name}</div><div class="loc">${p.location}</div></div>`;
      row.addEventListener('click', () => {
        map.flyTo({ center: [p.lng, p.lat], zoom: Math.max(map.getZoom(), 4), duration: 600 });
        openPopup(p.id);
        setActiveRow(p.id);
        if (window.innerWidth <= 860) closeSidebar();
      });
      details.appendChild(row);
    });
    listEl.appendChild(details);
  });
}
function setActiveRow(id){
  document.querySelectorAll('.row.active').forEach(r => r.classList.remove('active'));
  const row = document.querySelector(`.row[data-id="${id}"]`);
  if (row) row.scrollIntoView({ block: 'nearest' });
  if (row) row.classList.add('active');
}
renderList();

document.getElementById('stat-total').textContent = PARTNERS.length;
document.getElementById('stat-countries').textContent = new Set(PARTNERS.map(p => p.location.split(',').pop().trim())).size;

// --- Fullscreen ---
document.getElementById('fs-btn').addEventListener('click', () => {
  const el = document.getElementById('app');
  if (!document.fullscreenElement) el.requestFullscreen?.();
  else document.exitFullscreen?.();
});
document.addEventListener('fullscreenchange', () => map.resize());

// --- Mobile sidebar ---
const sidebar = document.getElementById('sidebar');
function closeSidebar(){ sidebar.classList.remove('open'); }
document.getElementById('mobile-toggle').addEventListener('click', () => sidebar.classList.add('open'));
document.getElementById('sb-close').addEventListener('click', closeSidebar);
</script>
</body>
</html>
